<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta name="google-site-verification" content="__1kAC5hQYxQmy1DhMZvTPq0wvNsREk-6Ke8dhu5Sok" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真實網路速度測試</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
            --label-color: #666;
            --value-color: #007bff;
            --border-color: #eee;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 25px;
            color: #2c3e50;
        }
        .result-group {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
            border: 1px solid var(--border-color);
        }
        .group-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            color: var(--text-color);
        }
        .group-title::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 20px;
            background-color: var(--value-color);
            margin-right: 10px;
            border-radius: 3px;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .label {
            color: var(--label-color);
        }
        .value {
            color: var(--value-color);
            font-weight: 600;
        }
        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 15px;
        }
        button:hover {
            background-color: #004494;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #status {
            font-size: 14px;
            color: var(--label-color);
        }
        .icon-down::before { content: '⬇ '; }
        .icon-up::before { content: '⬆ '; }
    </style>
</head>
<body>
    <div class="container">
        <h1>網路速度測試</h1>

        <!-- 下載區域 -->
        <div class="result-group">
            <div class="group-title icon-down">下載</div>
            <div class="data-row"><span class="label">速度</span><span class="value" id="down-speed">-- Mbps</span></div>
            <div class="data-row"><span class="label">延遲 (Ping)</span><span class="value" id="ping">-- ms</span></div>
            <div class="data-row"><span class="label">網路用量</span><span class="value" id="down-size">-- MB</span></div>
        </div>

        <!-- 上傳區域 -->
        <div class="result-group">
            <div class="group-title icon-up">上傳</div>
            <div class="data-row"><span class="label">速度</span><span class="value" id="up-speed">-- Mbps</span></div>
            <div class="data-row"><span class="label">狀態</span><span class="value" id="up-status">未測試</span></div>
        </div>

        <button id="start-btn" onclick="startRealTest()">開始測試</button>
        <div id="status">準備就緒</div>
    </div>

    <script>
        // 1. 測試延遲 (Ping)
        async function measurePing() {
            const startTime = performance.now();
            try {
                // 發送一個極小的請求來計算來回時間
                await fetch('https://www.cloudflare.com/cdn-cgi/trace', { cache: 'no-store' });
                const endTime = performance.now();
                return Math.round(endTime - startTime);
            } catch (e) {
                return 0;
            }
        }

        // 2. 測試真實下載速度
        async function measureDownload() {
            // 使用大一點的公開檔案來計算下載頻寬（例如 Wikimedia 的向量圖，約 500KB - 1MB 左右，帶隨機參數防止快取）
            const imageAddr = "https://upload.wikimedia.org/wikipedia/commons/3/3f/Placeholder_view_vector.svg?cache=" + Math.random();
            const fileSizeBits = 500000 * 8; // 假設約 500KB 的位元數 (可依實際檔案調整)
            
            const startTime = performance.now();
            try {
                const response = await fetch(imageAddr, { cache: 'no-store' });
                const blob = await response.blob();
                const endTime = performance.now();
                
                const durationSeconds = (endTime - startTime) / 1000;
                // 計算 Mbps
                const speedBps = fileSizeBits / durationSeconds;
                const speedMbps = (speedBps / 1024 / 1024).toFixed(2);
                const sizeMB = (blob.size / (1024 * 1024)).toFixed(2);

                return { speed: speedMbps, size: sizeMB };
            } catch (e) {
                return { speed: "0.00", size: "0" };
            }
        }

        async function startRealTest() {
            const btn = document.getElementById("start-btn");
            const status = document.getElementById("status");
            
            btn.disabled = true;
            status.innerText = "正在檢測網路延遲...";
            
            // 畫面重置
            document.getElementById("down-speed").innerText = "-- Mbps";
            document.getElementById("ping").innerText = "-- ms";
            document.getElementById("down-size").innerText = "-- MB";
            document.getElementById("up-speed").innerText = "模擬中...";
            document.getElementById("up-status").innerText = "受限於靜態空間";

            // 測 Ping
            const pingVal = await measurePing();
            document.getElementById("ping").innerText = pingVal + " ms";
            
            status.innerText = "正在進行真實下載測試...";

            // 測真實下載
            const result = await measureDownload();
            document.getElementById("down-speed").innerText = result.speed + " Mbps";
            document.getElementById("down-size").innerText = result.size + " MB";

            // 上傳部分因 GitHub Pages 無後端，採用安全提示
            document.getElementById("up-speed").innerText = "不支援";
            document.getElementById("up-status").innerText = "需專用後端伺服器";

            status.innerText = "測試完成！";
            btn.disabled = false;
        }
    </script>
</body>
</html>
