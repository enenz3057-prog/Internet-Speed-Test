<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta name="google-site-verification" content="__1kAC5hQYxQmy1DhMZvTPq0wvNsREk-6Ke8dhu5Sok" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業網路速度測試</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
            --label-color: #666;
            --value-color: #007bff;
            --border-color: #eee;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 25px;
            color: #2c3e50;
        }
        .result-group {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
            border: 1px solid var(--border-color);
        }
        .group-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            color: var(--text-color);
        }
        .group-title::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 20px;
            background-color: var(--value-color);
            margin-right: 10px;
            border-radius: 3px;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .label {
            color: var(--label-color);
        }
        .value {
            color: var(--value-color);
            font-weight: 600;
        }
        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 15px;
        }
        button:hover {
            background-color: #004494;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #status {
            font-size: 14px;
            color: var(--label-color);
        }

        /* Icons (簡單用文字代替) */
        .icon-down::before { content: '⬇ '; }
        .icon-up::before { content: '⬆ '; }
    </style>
</head>
<body>
    <div class="container">
        <h1>網路速度測試</h1>

        <!-- 下載區域 -->
        <div class="result-group">
            <div class="group-title icon-down">下載</div>
            <div class="data-row"><span class="label">速度</span><span class="value" id="down-speed">-- Mbps</span></div>
            <div class="data-row"><span class="label">延遲</span><span class="value" id="down-ping">-- ms</span></div>
            <div class="data-row"><span class="label">網路用量</span><span class="value" id="down-size">-- MB</span></div>
        </div>

        <!-- 上傳區域 -->
        <div class="result-group">
            <div class="group-title icon-up">上傳</div>
            <div class="data-row"><span class="label">速度</span><span class="value" id="up-speed">-- Mbps</span></div>
            <div class="data-row"><span class="label">延遲</span><span class="value" id="up-ping">-- ms</span></div>
            <div class="data-row"><span class="label">網路用量</span><span class="value" id="up-size">-- KB</span></div>
        </div>

        <button id="start-btn" onclick="startComprehensiveTest()">開始測試</button>
        <div id="status">準備就緒</div>
    </div>

    <script>
        // 模擬測試數據的函式 (真實測速需要連接專門伺服器，這裡為了展示介面做模擬)
        function simulateTest(callback) {
            // 模擬網路延遲 (50ms - 150ms)
            const ping = Math.floor(Math.random() * 100) + 50;
            
            // 模擬下載速度 (5 Mbps - 50 Mbps)
            const downSpeed = (Math.random() * 45 + 5).toFixed(2);
            // 模擬下載用量 (1MB - 5MB)
            const downSize = (Math.random() * 4 + 1).toFixed(2);

            // 模擬上傳速度 (1 Mbps - 10 Mbps)
            const upSpeed = (Math.random() * 9 + 1).toFixed(2);
            // 模擬上傳用量 (100KB - 500KB)
            const upSize = Math.floor(Math.random() * 400) + 100;

            setTimeout(() => {
                callback({ ping, downSpeed, downSize, upSpeed, upSize });
            }, 2000); // 模擬測試需要 2 秒
        }

        function startComprehensiveTest() {
            const btn = document.getElementById("start-btn");
            const status = document.getElementById("status");
            
            btn.disabled = true;
            status.innerText = "正在連接伺服器...";
            
            // 重置畫面
            const ids = ["down-speed", "down-ping", "down-size", "up-speed", "up-ping", "up-size"];
            ids.forEach(id => document.getElementById(id).innerText = "--");
            
            simulateTest((results) => {
                // 填入下載數據
                document.getElementById("down-speed").innerText = results.downSpeed + " Mbps";
                document.getElementById("down-ping").innerText = results.ping + " ms";
                document.getElementById("down-size").innerText = results.downSize + " MB";

                status.innerText = "正在測試上傳...";

                // 延遲一下模擬上傳測試
                setTimeout(() => {
                    // 填入上傳數據
                    document.getElementById("up-speed").innerText = results.upSpeed + " Mbps";
                    document.getElementById("up-ping").innerText = results.ping + " ms";
                    document.getElementById("up-size").innerText = results.upSize + " KB";

                    btn.disabled = false;
                    status.innerText = "測試完成！";
                }, 1000);
            });
        }
    </script>
</body>
</html>
