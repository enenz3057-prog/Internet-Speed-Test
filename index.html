<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta name="google-site-verification" content="__1kAC5hQYxQmy1DhMZvTPq0wvNsREk-6Ke8dhu5Sok" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真實網路速度測試</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
            --label-color: #666;
            --value-color: #007bff;
            --border-color: #eee;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 25px;
            color: #2c3e50;
        }
        .result-group {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
            border: 1px solid var(--border-color);
        }
        .group-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            color: var(--text-color);
        }
        .group-title::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 20px;
            background-color: var(--value-color);
            margin-right: 10px;
            border-radius: 3px;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .label {
            color: var(--label-color);
        }
        .value {
            color: var(--value-color);
            font-weight: 600;
        }
        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 15px;
        }
        button:hover {
            background-color: #004494;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #status {
            font-size: 14px;
            color: var(--label-color);
        }
        .icon-down::before { content: '⬇ '; }
        .icon-up::before { content: '⬆ '; }
    </style>
</head>
<body>
    <div class="container">
        <h1>網路速度測試</h1>

        <!-- 下載區域 -->
        <div class="result-group">
            <div class="group-title icon-down">下載</div>
            <div class="data-row"><span class="label">速度</span><span class="value" id="down-speed">-- Mbps</span></div>
            <div class="data-row"><span class="label">實際下載量</span><span class="value" id="down-size">-- MB</span></div>
        </div>

        <!-- 上傳區域 -->
        <div class="result-group">
            <div class="group-title icon-up">上傳</div>
            <div class="data-row"><span class="label">速度</span><span class="value" id="up-speed">-- Mbps</span></div>
            <div class="data-row"><span class="label">實際上傳量</span><span class="value" id="up-size">-- KB</span></div>
        </div>

        <button id="start-btn" onclick="startSpeedTest()">開始測試</button>
        <div id="status">準備就緒</div>
    </div>

    <script>
        // 1. 真實下載測試
        async function measureDownload() {
            const fileUrl = "https://upload.wikimedia.org/wikipedia/commons/b/b6/Image_created_with_a_mobile_phone.png?t=" + Date.now();
            const startTime = performance.now();
            try {
                const response = await fetch(fileUrl, { cache: 'no-store' });
                const blob = await response.blob();
                const endTime = performance.now();

                const bytesLoaded = blob.size;
                const durationSeconds = (endTime - startTime) / 1000;
                const mbps = ((bytesLoaded * 8) / durationSeconds / (1024 * 1024)).toFixed(2);
                const mbSize = (bytesLoaded / (1024 * 1024)).toFixed(2);

                return { speed: mbps, size: mbSize };
            } catch (e) {
                return { speed: "0.00", size: "0.00" };
            }
        }

        // 2. 真實上傳測試
        async function measureUpload() {
            const dataSize = 500 * 1024; 
            const data = new Uint8Array(dataSize);
            window.crypto.getRandomValues(data);

            const startTime = performance.now();
            try {
                await fetch('https://httpbin.org/post', {
                    method: 'POST',
                    body: data,
                    cache: 'no-store'
                });
                const endTime = performance.now();

                const durationSeconds = (endTime - startTime) / 1000;
                const mbps = ((dataSize * 8) / durationSeconds / (1024 * 1024)).toFixed(2);
                const kbSize = (dataSize / 1024).toFixed(0);

                return { speed: mbps, size: kbSize };
            } catch (e) {
                return { speed: "0.00", size: "0" };
            }
        }

        async function startSpeedTest() {
            const btn = document.getElementById("start-btn");
            const status = document.getElementById("status");
            
            btn.disabled = true;
            
            // 重置畫面
            document.getElementById("down-speed").innerText = "-- Mbps";
            document.getElementById("down-size").innerText = "-- MB";
            document.getElementById("up-speed").innerText = "-- Mbps";
            document.getElementById("up-size").innerText = "-- KB";

            status.innerText = "1/2 正在進行真實下載測試...";
            const downResult = await measureDownload();
            document.getElementById("down-speed").innerText = downResult.speed + " Mbps";
            document.getElementById("down-size").innerText = downResult.size + " MB";

            status.innerText = "2/2 正在進行真實上傳測試...";
            const upResult = await measureUpload();
            document.getElementById("up-speed").innerText = upResult.speed + " Mbps";
            document.getElementById("up-size").innerText = upResult.size + " KB";

            status.innerText = "測試完成！";
            btn.disabled = false;
        }
    </script>
</body>
</html>
